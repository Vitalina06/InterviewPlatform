input {
  file {
    path => "/logs/*.json"
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
  }
}

filter {
  # время события берём из лога, а не момент чтения файла
  date {
    match => ["@t", "ISO8601"]
    target => "@timestamp"
  }

  # Serilog не пишет уровень Information, добавляем сами
  if ![@l] {
    mutate { add_field => { "@l" => "Information" } }
  }

  mutate {
    rename => { "@m" => "message" "@l" => "level" }
    remove_field => ["@t", "log", "event", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "interview-logs-%{+YYYY.MM.dd}"
  }
}
